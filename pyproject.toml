[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "adaref-review"
version = "0.1.0"
description = "Core-method verification for AdaREF peer review"
readme = "README.md"
requires-python = ">=3.9,<3.12"
dependencies = ["numpy==1.26.4", "scipy==1.13.1", "torch==2.1.2"]

[project.scripts]
adaref-review = "adaref_review.demo:main"

[tool.setuptools]
packages = ["adaref_review"]
license-files = ["THIRD_PARTY_NOTICES.txt"]
